name: Prepare unsigned MSIX

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Package identity name from Partner Center or signing identity
        required: true
        type: string
      publisher:
        description: Exact publisher / certificate subject (CN=...)
        required: true
        type: string
      publisher_display_name:
        description: Publisher display name
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: >-
          python -m pip install PyQt5 PyMuPDF Pillow PyInstaller
          rapidocr onnxruntime opencv-python-headless numpy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci_test_runner.py
      - name: Build application and unsigned MSIX
        env:
          MSIX_IDENTITY: ${{ inputs.identity_name }}
          MSIX_PUBLISHER: ${{ inputs.publisher }}
          MSIX_PUBLISHER_DISPLAY: ${{ inputs.publisher_display_name }}
        run: |
          cmd /c build_exe.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_msix.py --identity-name $env:MSIX_IDENTITY --publisher $env:MSIX_PUBLISHER --publisher-display-name $env:MSIX_PUBLISHER_DISPLAY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve unsigned package for signing and installation tests
        uses: actions/upload-artifact@v6
        with:
          name: Leaflet-unsigned-msix
          path: Output/*_unsigned.msix
          if-no-files-found: error
          compression-level: 0
