name: Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: >-
          python -m pip install PyQt5 PyMuPDF Pillow PyInstaller
          rapidocr onnxruntime opencv-python-headless numpy

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci_test_runner.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: |
          cmd /c build_exe.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c build_installer.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare matching source and dependency directions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python create_source_bundle.py --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create checksums and latest alias
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "Output\Leaflet_Setup_$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  Leaflet_Setup_$version.exe" |
            Set-Content -Encoding ascii -LiteralPath "$installer.sha256"
          $latestInstaller = "Output\Leaflet_Setup_latest.exe"
          Copy-Item -LiteralPath $installer -Destination $latestInstaller
          # Older installed versions only recognize the sPDF installer name.
          Copy-Item -LiteralPath $installer -Destination "Output\sPDF_Setup_$version.exe"
          "$hash  Leaflet_Setup_latest.exe" |
            Set-Content -Encoding ascii -LiteralPath "$latestInstaller.sha256"

      - name: Preserve release files as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Leaflet-${{ github.ref_name }}-windows
          path: |
            Output/Leaflet_Setup_*.exe
            Output/sPDF_Setup_*.exe
            Output/Leaflet_Setup_*.exe.sha256
            Output/Leaflet_Source_*.zip
            Output/Leaflet_Source_*.zip.sha256
            Output/Leaflet_Dependency_Sources_*.md
          compression-level: 0

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $installer = "Output\Leaflet_Setup_$version.exe"
          $latestInstaller = "Output\Leaflet_Setup_latest.exe"
          $legacyInstaller = "Output\sPDF_Setup_$version.exe"
          $sourceArchive = "Output\Leaflet_Source_$version.zip"
          $dependencySources = "Output\Leaflet_Dependency_Sources_$version.md"
          python release_notes.py --version $version --release-notes RELEASE_NOTES.md --release-notes-ko RELEASE_NOTES.ko.md --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "`nDownload Leaflet_Setup_$version.exe. The sPDF installer is an identical alias for older automatic updaters. / Leaflet_Setup_$version.exe를 받으세요. sPDF 설치 파일은 기존 버전 자동 업데이트용이며 내용은 같습니다.`n`nSHA-256 (all installers): ``$hash``" |
            Add-Content -Encoding utf8 -LiteralPath release-notes.md
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Leaflet $version" `
              --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $installer $latestInstaller $legacyInstaller $sourceArchive `
              "$sourceArchive.sha256" $dependencySources --clobber
          } else {
            gh release create $tag $installer $latestInstaller $legacyInstaller $sourceArchive `
              "$sourceArchive.sha256" $dependencySources `
              --verify-tag --title "Leaflet $version" `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
