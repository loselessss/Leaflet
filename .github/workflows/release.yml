name: Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: >-
          python -m pip install PyQt5 PyMuPDF Pillow PyInstaller
          rapidocr onnxruntime opencv-python-headless numpy

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci_test_runner.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: |
          cmd /c build_exe.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c build_installer.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare matching source and dependency directions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python create_source_bundle.py --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create checksums and latest alias
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "Output\sPDF_Setup_$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  sPDF_Setup_$version.exe" |
            Set-Content -Encoding ascii -LiteralPath "$installer.sha256"
          $latestInstaller = "Output\sPDF_Setup_latest.exe"
          Copy-Item -LiteralPath $installer -Destination $latestInstaller
          "$hash  sPDF_Setup_latest.exe" |
            Set-Content -Encoding ascii -LiteralPath "$latestInstaller.sha256"

      - name: Preserve installer as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: sPDF-${{ github.ref_name }}-windows
          path: |
            Output/sPDF_Setup_*.exe
            Output/sPDF_Setup_*.exe.sha256
            Output/sPDF_Source_*.zip
            Output/sPDF_Source_*.zip.sha256
            Output/sPDF_Dependency_Sources_*.md
          compression-level: 0

      - name: Publish matching sources separately
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $sourceTag = "sources-v$version"
          $sourceArchive = "Output\sPDF_Source_$version.zip"
          $dependencySources = "Output\sPDF_Dependency_Sources_$version.md"
          "Corresponding sources for sPDF $version. Download the application source archive and dependency source directions together. / sPDF $version 대응 소스입니다. 앱 소스와 의존성 소스 안내를 함께 받으세요." |
            Set-Content -Encoding utf8 -LiteralPath source-notes.md
          gh release view $sourceTag --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $sourceTag --target $env:GITHUB_SHA --prerelease --latest=false `
              --title "sPDF $version — Sources" --notes-file source-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $sourceCommit = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$sourceTag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -ne $env:GITHUB_SHA) { throw "Source tag belongs to a different commit" }
          gh release edit $sourceTag --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $sourceTag $sourceArchive "$sourceArchive.sha256" $dependencySources --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $installer = "Output\sPDF_Setup_$version.exe"
          $latestInstaller = "Output\sPDF_Setup_latest.exe"
          python release_notes.py --version $version --release-notes RELEASE_NOTES.md --release-notes-ko RELEASE_NOTES.ko.md --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/sources-v$version"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "`n[Source code and dependency sources / 대응 소스 및 의존성 소스]($sourceUrl)`n`nSHA-256 (both installers): ``$hash``" |
            Add-Content -Encoding utf8 -LiteralPath release-notes.md
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "sPDF $version" `
              --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $installer $latestInstaller --clobber
          } else {
            gh release create $tag $installer $latestInstaller `
              --verify-tag --title "sPDF $version" `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
