[package]
name = "leaflet-path-packer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_path_packer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
