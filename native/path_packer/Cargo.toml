[package]
name = "leaflet-path-packer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_path_packer"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]
worker = []

[[bin]]
name = "leaflet-gpu-scene-worker"
path = "src/bin/scene_worker.rs"
required-features = ["worker"]

[dependencies]
pyo3 = { version = "=0.27.2", optional = true, features = ["extension-module", "abi3-py312"] }
lz4_flex = "=0.14.0"
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
